[project]
name = "aura-rag"
version = "0.1.0"
description = "AURA RAG document question-answering application"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "streamlit",
    "pandas",
    "psutil",
    "langchain-core",
    "langchain-community",
    "langchain-classic",
    "langchain-text-splitters",
    "langchain-huggingface",
    "langchain-chroma",
    "sentence-transformers",
    "rank-bm25",
    "pypdf",
    "docx2txt",
    "pymupdf",
    "pytesseract",
    "pillow",
    "openai",
]

[project.optional-dependencies]
cuda = ["torch>=2.11.0"]

[tool.uv]
package = false

[tool.uv.sources]
torch = [
    { index = "pytorch-cu130", extra = "cuda", marker = "sys_platform == 'win32' or sys_platform == 'linux'" },
]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

